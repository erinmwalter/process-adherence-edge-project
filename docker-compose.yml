services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  dashboard:
    build: ./pc-dashboard
    ports:
      - "5000:5000"
    depends_on:
      - broker
    environment:
      - MQTT_HOST=broker
      - MQTT_PORT=1883
